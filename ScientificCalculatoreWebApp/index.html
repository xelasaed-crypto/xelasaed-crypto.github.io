<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator & Grapher</title>
    <link rel="stylesheet" href="style.css">
    <!-- Plotly.js CDN -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Scientific Calculator</h1>
            <nav>
                <button id="tabCalc" class="active">Calculator</button>
                <button id="tabGraph">Graphing</button>
            </nav>
        </header>

        <main>
            <!-- Calculator Section -->
            <section id="calcSection">
                <div class="display-container">
                    <div id="historyDisplay" class="history-text"></div>
                    <div id="currentInput" class="input-text">0</div>
                </div>

                <div class="button-grid">
                    <!-- Memory Functions -->
                    <button class="btn secondary" onclick="memoryAction('MC')">MC</button>
                    <button class="btn secondary" onclick="memoryAction('MR')">MR</button>
                    <button class="btn secondary" onclick="memoryAction('M+')">M+</button>
                    <button class="btn secondary" onclick="memoryAction('M-')">M-</button>

                    <!-- Scientific Functions -->
                    <button class="btn scientific" onclick="appendFunc('sin(')">sin</button>
                    <button class="btn scientific" onclick="appendFunc('cos(')">cos</button>
                    <button class="btn scientific" onclick="appendFunc('tan(')">tan</button>
                    <button class="btn scientific" onclick="appendFunc('asin(')">asin</button>
                    <button class="btn scientific" onclick="appendFunc('acos(')">acos</button>
                    <button class="btn scientific" onclick="appendFunc('atan(')">atan</button>
                    <button class="btn scientific" onclick="appendFunc('log(')">log</button>
                    <button class="btn scientific" onclick="appendFunc('ln(')">ln</button>
                    <button class="btn scientific" onclick="appendFunc('sqrt(')">√</button>
                    <button class="btn scientific" onclick="appendFunc('^')">^</button>
                    <button class="btn scientific" onclick="appendFunc('!')">x!</button>
                    <button class="btn scientific" onclick="appendChar('(')">(</button>
                    <button class="btn scientific" onclick="appendChar(')')">)</button>

                    <!-- Standard Numbers & Operators -->
                    <button class="btn number" onclick="appendChar('7')">7</button>
                    <button class="btn number" onclick="appendChar('8')">8</button>
                    <button class="btn number" onclick="appendChar('9')">9</button>
                    <button class="btn operator" onclick="appendChar('/')">÷</button>

                    <button class="btn number" onclick="appendChar('4')">4</button>
                    <button class="btn number" onclick="appendChar('5')">5</button>
                    <button class="btn number" onclick="appendChar('6')">6</button>
                    <button class="btn operator" onclick="appendChar('*')">×</button>

                    <button class="btn number" onclick="appendChar('1')">1</button>
                    <button class="btn number" onclick="appendChar('2')">2</button>
                    <button class="btn number" onclick="appendChar('3')">3</button>
                    <button class="btn operator" onclick="appendChar('-')">-</button>

                    <button class="btn number" onclick="appendChar('0')">0</button>
                    <button class="btn number" onclick="appendChar('.')">.</button>
                    <button class="btn equal" onclick="calculate()">=</button>
                    <button class="btn operator" onclick="appendChar('+')">+</button>

                    <button class="btn clear" onclick="clearAll()">AC</button>
                </div>

                <div class="history-panel">
                    <h3>History</h3>
                    <ul id="historyList"></ul>
                    <button class="btn small" onclick="clearHistory()">Clear History</button>
                </div>
            </section>

            <!-- Graphing Section -->
            <section id="graphSection" style="display: none;">
                <div class="controls">
                    <div class="input-group">
                        <label for="func2D">Function f(x):</label>
                        <input type="text" id="func2D" placeholder="e.g., sin(x) * x^2">
                    </div>
                    <div class="input-group">
                        <label for="range2D">Range (min, max):</label>
                        <input type="text" id="range2D" value="-10, 10">
                    </div>
                    <button class="btn" onclick="plot2D()">Plot 2D</button>

                    <hr>

                    <div class="input-group">
                        <label for="func3D">Surface f(x, y):</label>
                        <input type="text" id="func3D" placeholder="e.g., sin(x) * cos(y)">
                    </div>
                    <button class="btn" onclick="plot3D()">Plot 3D</button>
                </div>
                <div id="plotArea"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
