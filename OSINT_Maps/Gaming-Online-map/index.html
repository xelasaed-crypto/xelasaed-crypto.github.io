<head>

  <title>Global Online Gaming: Regulation & Market Overview</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- Shared CSS (themeable) -->
  <link rel="stylesheet" href="../shared/css/style.css"/>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
</head>
<body>
  <div id="loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">LOADING GLOBAL ONLINE GAMING DATA...</div>
  </div>

  <div id="bg-layer"></div>
  <div class="scanlines"></div>
  <div class="grid-overlay"></div>

  <div id="map"></div>

  <div id="sidePanel">
    <div class="panel-header">
      <h2 id="countryName">Select a Country</h2>
      <button id="closeBtn">×</button>
    </div>
    <div id="panelContent" class="panel-body">
      <p style="color:#aaa; text-align:center;">Click a country to view global online gaming details.</p>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ── Map Configuration ──────────────────────────────── -->
  <script>
    window.mapConfig = {
        topicDataKey:  "gamingData", // Changed from "aiData"
        geoJsonUrl:    "https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json",
        highlightColor: "#00f3ff",
        defaultColor:  "#00f3ff",
        
        // Custom section titles for the gaming map
        sectionTitles: {
            fields: "Regulatory Overview",
            notes:  "Market Details & Investigations",
            refs:   "Sources & Legislation"
        },

        // Expanded fields to show all the new data points
        panelFields: [
            { label: "Status",         value: "status" },
            { label: "Legality",       value: "legality" },
            { label: "Regulator",      value: "regulation" },
            { label: "Restrictions",   value: "restrictions" },
            { label: "Major Operators",value: "companies" },
            { label: "Industry Ties",  value: "businessRelations" },
            { label: "Investigations", value: "investigations" }
        ],
        panelNotes: true,
        panelRefs:  true,
        emptyMsg:   "Data Pending"
    };
  </script>

  <!-- Data Layer -->
  <script src="js/data/references.js"></script>
